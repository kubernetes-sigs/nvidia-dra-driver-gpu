{{- if .Values.serviceAccount.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" . }}-clusterrole-kubeletplugin
rules:
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomains"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
{{- if (and $.Values.resources.gpus.enabled (and $.Values.featureGates (and (hasKey $.Values.featureGates "ResourceClaimDeviceStatus") $.Values.featureGates.ResourceClaimDeviceStatus))) }}
# Required for publishing per-device status (KEP-4817) into
# ResourceClaim.status.devices when the ResourceClaimDeviceStatus driver
# feature gate is enabled.
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims/status"]
  verbs: ["update"]
# Kubernetes 1.36+ enforces granular authorization for ResourceClaim status
# writes via the DRAResourceClaimGranularStatusAuthorization feature gate. As a
# node-local driver, we need the "associated-node" verbs on
# "resourceclaims/driver" for our own driver name. This rule is inert on older
# clusters that have not yet enabled the feature gate.
# See https://github.com/kubernetes/kubernetes/issues/138149
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims/driver"]
  verbs: ["associated-node:update", "associated-node:patch"]
  resourceNames: ["gpu.nvidia.com"]
{{- end }}
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-kubeletplugin
  namespace: {{ include "dra-driver-nvidia-gpu.namespace" . }}
  labels:
    {{- include "dra-driver-nvidia-gpu.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-clusterrole-binding-kubeletplugin
subjects:
  - kind: ServiceAccount
    name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-kubeletplugin
    namespace: {{ include "dra-driver-nvidia-gpu.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-clusterrole-kubeletplugin
  apiGroup: rbac.authorization.k8s.io

{{- range $namespace := splitList "," (include "dra-driver-nvidia-gpu.namespaces" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-role-kubeletplugin
  namespace: {{ $namespace }}
rules:
- apiGroups: ["resource.nvidia.com"]
  resources: ["computedomaincliques"]
  verbs: ["get"]
{{- if (and $.Values.resources.gpus.enabled (and $.Values.featureGates (and (hasKey $.Values.featureGates "MPSSupport") $.Values.featureGates.MPSSupport))) }}
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-role-binding-kubeletplugin
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-kubeletplugin
    namespace: {{ include "dra-driver-nvidia-gpu.namespace" $ }}
roleRef:
  kind: Role
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-role-kubeletplugin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" $ }}-openshift-privileged-role-binding-kubeletplugin
subjects:
- kind: ServiceAccount
  name: {{ include "dra-driver-nvidia-gpu.serviceAccountName" $ }}-kubeletplugin
  namespace: {{ include "dra-driver-nvidia-gpu.namespace" $ }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
